name: Version Pipeline

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.make.outputs.version }}
    steps:
      - name: Make version
        id: make
        shell: bash
        run: echo "version=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  consume:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Use version
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: echo "Version is $VERSION"

      - name: Fail if empty
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        shell: bash
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "Version was empty"
            exit 1
          fi
